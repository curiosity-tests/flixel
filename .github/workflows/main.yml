name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches:
    - dev
    paths-ignore:
    - '**/*.md'
    - '.vscode/*'
    - 'images/*'
    - 'script/*'
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  repository_dispatch:
  schedule:
    - cron: '0 4 * * *'


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build:
    strategy:
      matrix:
        haxe-version: ["4.2.5", "4.3.7"]
        target: [html5, hl, flash, cpp]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - run: sudo apt-get update
    
    - uses: actions/checkout@v3
    
    - uses: krdlab/setup-haxe@v1
      with:
        haxe-version: ${{matrix.haxe-version}}
    
    - name: "Configure Haxelib"
      run: |
        haxelib setup /home/runner/haxe/haxelib/
        haxelib install haxelib 4.0.3
        haxelib dev flixel .
    
    - uses: HaxeFlixel/setup-flixel@master
      with:
        flixel-versions: dev
        test-location: local
        target: ${{matrix.target}}
        run-tests: true
